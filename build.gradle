plugins {
    id 'application'
}

group = 'dev.gafipro'
version = providers.gradleProperty('project_version').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dev.gafipro.gafiloader.Main'
    applicationName = 'gafi-loader'
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'net.fabricmc:mapping-io:0.9.1'
    implementation 'net.fabricmc:tiny-remapper:0.15.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'GafiLoader Compatibility Diagnostic Tools',
            'Implementation-Version': project.version,
            'Main-Class': application.mainClass.get()
        )
    }
}

/*
 * This deliberately small JAR is inserted into the dedicated Minecraft profile classpath.
 * It contains the pre-launch bootstrap, metadata override generator, targeted compatibility
 * transformer, Gson, and Mapping-IO. ASM is deliberately resolved from Minecraft 26.2's
 * own runtime classpath; bundling another copy makes Fabric Loader abort with duplicate ASM classes.
 */
def bootstrapJarTask = tasks.register('bootstrapJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveFileName = 'gafiloader-bootstrap.jar'
    destinationDirectory = layout.buildDirectory.dir('bootstrap')
    from(sourceSets.main.output.classesDirs) {
        include 'dev/gafipro/gafiloader/LaunchBootstrap.class'
        include 'dev/gafipro/gafiloader/LegacyDependencyOverrideGenerator.class'
        include 'dev/gafipro/gafiloader/LegacyDependencyOverrideGenerator$Result.class'
        include 'dev/gafipro/gafiloader/LegacyMinecraftVersionDetector.class'
        include 'dev/gafipro/gafiloader/LegacyModCompatibilityTransformer*.class'
        include 'dev/gafipro/gafiloader/LegacyMappingRepository*.class'
        include 'dev/gafipro/gafiloader/LegacyClassTweakerMappings*.class'
        include 'dev/gafipro/gafiloader/LegacyClassTweakerRemapper*.class'
        include 'dev/gafipro/gafiloader/MojangMappings*.class'
    }
    from(configurations.runtimeClasspath.filter {
        it.name.startsWith('gson-') || it.name.startsWith('mapping-io-')
    }.collect { zipTree(it) }) {
        include 'com/google/gson/**'
        include 'net/fabricmc/mappingio/**'
    }
    manifest {
        attributes(
            'Main-Class': 'dev.gafipro.gafiloader.LaunchBootstrap',
            'Implementation-Version': project.version
        )
    }
}

tasks.named('processResources') {
    dependsOn bootstrapJarTask
    from(bootstrapJarTask.flatMap { it.archiveFile }) {
        into 'bootstrap'
    }
}
