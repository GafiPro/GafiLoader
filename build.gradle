plugins {
    id 'application'
}

group = 'dev.gafipro'
version = providers.gradleProperty('project_version').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dev.gafipro.gafiloader.Main'
    applicationName = 'gafi-loader'
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-commons:9.9.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'net.fabricmc:mapping-io:0.9.1'
    implementation 'net.fabricmc:tiny-remapper:0.15.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}


tasks.named('test') {
    // Exercise the actual packaged javaagent, not only the bytecode helper in unit tests.
    dependsOn tasks.named('jar')
    systemProperty 'gafi.loader.agent.jar',
            tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    def fabricLoaderJar = providers.gradleProperty('gafiFabricLoaderJar')
    if (fabricLoaderJar.isPresent()) {
        systemProperty 'gafi.loader.fabric.loader.jar', fabricLoaderJar.get()
    }

    // Real-artifact integration tests are enabled only when CI provides the pinned public fixtures.
    [
        'GAFI_REAL_TARGET_GAME': 'gafi.loader.real.target.jar',
        'GAFI_REAL_LEGACY_MOD': 'gafi.loader.real.mod.jar',
        'GAFI_REAL_INTERMEDIARY_MAPPINGS': 'gafi.loader.real.intermediary.jar',
        'GAFI_REAL_LEGACY_MAPPINGS': 'gafi.loader.real.official.mappings'
    ].each { environmentName, propertyName ->
        def configuredPath = System.getenv(environmentName)
        if (configuredPath != null && !configuredPath.isBlank()) {
            systemProperty propertyName, configuredPath
        }
    }
}

jar {
    // A self-contained JAR is required because a Java agent's dependencies must be
    // visible to the system class loader before Minecraft/Fabric starts loading.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC', 'META-INF/SIG-*'
    exclude '**/module-info.class'

    manifest {
        attributes(
            'Implementation-Title': 'Gafi Loader',
            'Implementation-Version': project.version,
            'Main-Class': application.mainClass.get(),
            'Premain-Class': 'dev.gafipro.gafiloader.GameSideCompatibilityAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false'
        )
    }
}
