name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test with the pinned Gradle wrapper (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean test build
      - name: Build and test with the pinned Gradle wrapper (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean test build
