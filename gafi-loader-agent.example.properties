# Gafi Loader runtime agent configuration.
# Paths may be absolute or relative to this file. On Windows, prefer forward slashes.
#
# Optional: reviewed game-side method bridge rules.
# rules=compatibility-rules.tsv
#
# Remap direct 1.21.11 Intermediary references in mod bytecode at class-definition time.
# The agent also hooks Fabric's Mixin resource reader to remap recognized Mixin config/refmap
# JSON strings in memory; original mod JAR resources are not modified.
intermediaryMappings=intermediary-1.21.11-v2.jar
legacyMappings=1.21.11-client-mappings.txt
#
# Optional: reviewed CLASS / METHOD / FIELD aliases applied after namespace normalization.
# When enabled, targetGameJar is required to validate every alias against the actual target API.
# Use the same tab-separated syntax as aliases.example.tsv. Owners and descriptors on the left
# use the named (Mojang) 1.21.11 symbols; the right side uses the 26.2 runtime names.
# targetGameJar=/path/to/.minecraft/versions/26.2/26.2.jar
# bytecodeAliases=runtime-bytecode-aliases.tsv
